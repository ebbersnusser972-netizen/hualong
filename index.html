/* Layout: 左侧导航面板 + 右侧工作区（顶部标题栏、步骤视图、底部状态栏）；手机宽度时导航变为顶部横向标签 */
/* 单一暗色主题：墨夜 + 霓虹（青 / 紫 / 桃红），金色点缀 */
:root {
  --bg: #0A0C1C;
  --surface: #141830;
  --surface-2: #1D2246;
  --well: #0E1126;
  --line: #2C3364;
  --fg: #EEF0FC;
  --muted: #9BA4CC;
  --accent: #6FE3FF;
  --accent-fg: #071320;
  --accent-soft: #15304B;
  --brand: #FF4D8D;
  --brand-2: #FFB547;
  --ink: #0A0F1E;
  --ok: #4BE3A0;
  --ok-soft: #10382B;
  --warn: #FFC457;
  --warn-soft: #3B2D10;
  --danger: #FF7B7B;
  --danger-soft: #45192A;
  --grad: linear-gradient(110deg, #6FE3FF, #8F84FF 52%, #FF6FA5);
  --grad-warm: linear-gradient(110deg, #FFE08A, #FF8A3C 55%, #FF4D8D);
  --shadow: 0 10px 34px rgba(0,0,0,.38);
  --font: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", "Hiragino Sans GB", system-ui, sans-serif;
  --display: "ZCOOL QingKe HuangYou", "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", sans-serif;
  --brush: "Ma Shan Zheng", "STXingkai", "KaiTi", "STKaiti", cursive;
  --mono: ui-monospace, "Cascadia Mono", Consolas, "Microsoft YaHei", monospace;
  --r: 12px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; } /* the zoom overlay sets display:grid; without this it covers the page even when hidden */
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 14px; line-height: 1.6; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; line-height: 1.3; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app {
  display: grid; grid-template-columns: 248px minmax(0, 1fr); gap: 16px;
  min-height: 100vh;
  padding-block: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* Sidebar */
.side {
  background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
  padding: 18px 14px; display: flex; flex-direction: column; gap: 18px;
  position: sticky; top: 16px; align-self: start; max-height: calc(100vh - 32px); overflow-y: auto;
}
.brand { display: flex; align-items: center; gap: 12px; padding: 0 4px; }
.logo { width: 44px; height: 44px; border-radius: 12px; flex: none; display: grid; place-items: center;
  background: linear-gradient(135deg, var(--brand-2), var(--brand)); color: #fff; }
.brand b { display: block; font-size: 17px; letter-spacing: .02em; }
.brand span { display: block; font-size: 11.5px; color: var(--muted); letter-spacing: .06em; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav button {
  display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
  border: 0; background: none; padding: 9px 10px; border-radius: 10px; cursor: pointer; color: var(--fg);
}
.nav button:hover { background: var(--surface-2); }
.nav button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.nav .num { width: 22px; height: 22px; border-radius: 50%; flex: none; display: grid; place-items: center;
  font-size: 12px; font-variant-numeric: tabular-nums; background: var(--surface-2); color: var(--muted); }
.nav button.on .num { background: var(--accent); color: var(--accent-fg); }
.nav .num.done { background: var(--ok-soft); color: var(--ok); }
.nav .num.doing { background: var(--warn-soft); color: var(--warn); }
.nav .lbl { flex: 1; min-width: 0; }
.side-sec { border-top: 1px solid var(--line); padding-top: 14px; display: flex; flex-direction: column; gap: 8px; }
.side-sec-head { display: flex; justify-content: space-between; align-items: center; padding: 0 4px; }
.side-sec-head span { font-size: 12.5px; color: var(--muted); }
.icon-btn { border: 0; background: none; cursor: pointer; width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; color: var(--muted); }
.icon-btn:hover { background: var(--surface-2); color: var(--fg); }
.plist { display: flex; flex-direction: column; gap: 6px; }
.pitem { text-align: left; border: 1px solid transparent; background: none; border-radius: 10px; padding: 8px 10px; cursor: pointer; }
.pitem:hover { background: var(--surface-2); }
.pitem.on { background: var(--surface); border-color: var(--line); box-shadow: var(--shadow); }
.pitem b { display: block; font-weight: 600; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pitem span { font-size: 12px; color: var(--muted); }
.tag-demo { font-size: 11px; color: var(--brand); border: 1px solid currentColor; border-radius: 4px; padding: 0 4px; margin-left: 4px; font-weight: 500; }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 8px; }
.side-foot .row { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
.psel { display: none; }

/* Main */
.main { min-width: 0; display: flex; flex-direction: column; gap: 16px; }
.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; padding: 6px 4px 0; }
.top h1 { font-size: 26px; letter-spacing: .01em; }
.top .sub { color: var(--muted); margin-top: 4px; }
.name-input { font-size: 13px; border: 1px dashed transparent; background: none; padding: 2px 6px; margin-left: -6px; border-radius: 6px; color: var(--muted); width: min(420px, 100%); }
.name-input:hover, .name-input:focus { border-color: var(--line); background: var(--surface); color: var(--fg); }
.chip { display: inline-flex; align-items: center; gap: 8px; border-radius: 999px; padding: 7px 14px; font-size: 13px;
  background: var(--surface); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.chip.on { color: var(--accent); } .chip.on i { background: var(--ok); }
.chip.off i { background: var(--warn); }
.view { display: flex; flex-direction: column; gap: 16px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; box-shadow: var(--shadow); min-width: 0; }
.card h3 { font-size: 16px; }
.card-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 7px 14px; cursor: pointer; font-size: 13.5px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { border-color: transparent; background: none; color: var(--muted); }
.btn.danger { color: var(--danger); border-color: var(--danger-soft); background: var(--danger-soft); }
.btn:disabled { opacity: .5; cursor: not-allowed; filter: none; }
.btn.sm { padding: 4px 10px; font-size: 12.5px; }

.hero p { color: var(--muted); max-width: 62ch; margin: 8px 0 14px; }
.hero h2 { font-size: 19px; }
.newform { display: flex; gap: 10px; flex-wrap: wrap; }
.newform input { flex: 1 1 260px; min-width: 0; }
.sec-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-top: 6px; }
.sec-head h3 { font-size: 19px; }

.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; border-radius: 999px; padding: 1px 9px; font-weight: 500; white-space: nowrap; }
.pill.todo { background: var(--surface-2); color: var(--muted); }
.pill.doing { background: var(--warn-soft); color: var(--warn); }
.pill.done { background: var(--ok-soft); color: var(--ok); }

label.f { display: flex; flex-direction: column; gap: 5px; font-size: 13px; color: var(--muted); min-width: 0; }
input[type=text], input[type=number], select, textarea {
  width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 8px 11px; color: var(--fg);
}
textarea { resize: vertical; line-height: 1.65; field-sizing: content; min-height: 4.5em; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.span2 { grid-column: span 2; }

.banner { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; background: var(--warn-soft); color: var(--warn); border-radius: var(--r); padding: 10px 16px; font-size: 13.5px; }
.banner .spacer { flex: 1; }

.choices { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.choice { border: 1.5px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 8px; background: var(--surface); cursor: pointer; min-width: 0; }
.choice.on { border-color: var(--accent); background: var(--accent-soft); }
.choice .meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.choice textarea { background: var(--surface); }
.choice .why { font-size: 12.5px; color: var(--muted); }
.formula { font-size: 12px; font-weight: 600; color: var(--accent); }

.job { border: 1px dashed var(--accent); border-radius: var(--r); padding: 12px 14px; background: var(--accent-soft); display: flex; flex-direction: column; gap: 6px; }
.job-head { display: flex; align-items: center; gap: 10px; color: var(--accent); font-size: 13px; font-weight: 600; }
.job-text { white-space: pre-wrap; font-size: 13px; color: var(--fg); max-height: 220px; overflow: auto; }
.dots::after { content: "…"; animation: blink 1.2s steps(3) infinite; }
@keyframes blink { 0% { opacity: .2; } 50% { opacity: 1; } 100% { opacity: .2; } }
@media (prefers-reduced-motion: reduce) { .dots::after { animation: none; } }

.counter { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.note { font-size: 13px; color: var(--muted); background: var(--surface-2); border-radius: 9px; padding: 10px 12px; white-space: pre-wrap; }

.shots { display: flex; flex-direction: column; gap: 12px; }
.shot { border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 10px; background: var(--surface); }
.shot-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.shot-head b { font-size: 14px; }
.shot-head input[type=number] { width: 72px; padding: 4px 8px; }
.toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); cursor: pointer; }
.toggle input { width: 16px; height: 16px; accent-color: var(--accent); }
.timeline { display: flex; height: 10px; border-radius: 6px; overflow: hidden; background: var(--surface-2); }
.timeline span { height: 100%; border-right: 2px solid var(--surface); }
.timeline .ai { background: var(--accent); }
.timeline .real { background: var(--brand-2); }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }

.pcard { border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.pcard.gen { border-color: var(--ok); }
.pblock { display: flex; flex-direction: column; gap: 4px; }
.pblock .lab { display: flex; justify-content: space-between; align-items: center; font-size: 12.5px; color: var(--muted); }
.code { font-family: var(--font); background: var(--surface-2); border-radius: 9px; padding: 10px 12px; white-space: pre-wrap; word-break: break-word; font-size: 13.5px; }
details.guide { border: 1px solid var(--line); border-radius: var(--r); padding: 12px 16px; background: var(--surface); }
details.guide summary { cursor: pointer; font-weight: 600; }
details.guide ol { margin: 8px 0 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
.guide-cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-top: 8px; }
.guide-cols h4 { font-size: 14px; }

.checks { display: flex; flex-direction: column; gap: 8px; }
.check { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border-radius: 9px; cursor: pointer; }
.check:hover { background: var(--surface-2); }
.check input { width: 17px; height: 17px; margin-top: 3px; accent-color: var(--ok); flex: none; }
.check.key { background: var(--warn-soft); }
.check.key b { color: var(--warn); }
.check.final { border: 1.5px solid var(--ok); }

.stepnav { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.empty { text-align: center; padding: 36px 20px; color: var(--muted); display: flex; flex-direction: column; gap: 12px; align-items: center; }
.confirm { background: var(--danger-soft); color: var(--danger); border-radius: 10px; padding: 10px; font-size: 13px; display: flex; flex-direction: column; gap: 8px; }

.bar { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); padding: 4px 4px 0; }
.bar .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); margin-right: 6px; }
.bar .dot.busy { background: var(--warn); }
#toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 8px 18px; border-radius: 999px; font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 20; }
#toast.show { opacity: 1; }

.nav-sep { height: 1px; background: var(--line); margin: 6px 4px; flex: none; }
.nav .ico { width: 22px; display: grid; place-items: center; color: var(--muted); flex: none; }
.nav button.on .ico { color: var(--accent); }
.chip { cursor: pointer; }
.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: 10px; }
.thumb { margin: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface-2); display: flex; flex-direction: column; min-width: 0; }
.thumb.sel { outline: 2px solid var(--accent); outline-offset: -1px; }
.thumb img { width: 100%; aspect-ratio: 2 / 3; object-fit: cover; display: block; cursor: zoom-in; }
.thumb .cap { font-size: 12px; color: var(--muted); padding: 5px 7px 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.thumb figcaption { display: flex; gap: 4px; flex-wrap: wrap; padding: 6px; }
.imgjob { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--accent); background: var(--accent-soft); border-radius: 9px; padding: 8px 12px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; flex-wrap: wrap; }
.seg label { padding: 7px 14px; cursor: pointer; font-size: 13.5px; display: flex; gap: 6px; align-items: center; position: relative; }
.seg label.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.okline { color: var(--ok); } .errline { color: var(--danger); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.drop { display: flex; align-items: center; justify-content: center; gap: 8px; border: 1.5px dashed var(--line); border-radius: 10px; padding: 14px; color: var(--muted); font-size: 13px; cursor: pointer; text-align: center; }
.drop:hover, .drop.over { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.drop:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.vids { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.vid { margin: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface-2); min-width: 0; }
.vid.sel { outline: 2px solid var(--ok); outline-offset: -1px; }
.vid video { width: 100%; aspect-ratio: 9 / 16; object-fit: contain; display: block; background: #000; }
.vid figcaption { display: flex; gap: 4px; flex-wrap: wrap; padding: 6px; }
.vidbox { border-top: 1px dashed var(--line); padding-top: 12px; display: flex; flex-direction: column; gap: 10px; }
.rc-wrap { display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); gap: 20px; align-items: start; }
.player { position: relative; width: 100%; aspect-ratio: 9 / 16; background: #000; border-radius: 12px; overflow: hidden; }
.player video { width: 100%; height: 100%; object-fit: contain; display: block; }
.rc-sub { position: absolute; left: 6%; right: 6%; bottom: 14%; text-align: center; color: #fff; font-weight: 700; font-size: 17px; text-shadow: 0 1px 3px #000, 0 0 8px #000; pointer-events: none; }
.rc-label { position: absolute; left: 10px; top: 10px; color: #fff; font-size: 12px; background: rgba(0,0,0,.5); padding: 2px 8px; border-radius: 999px; pointer-events: none; }
.slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.slot { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; min-width: 0; }
.slot .drop { padding: 6px; font-size: 12px; }
.lightbox { position: fixed; inset: 0; background: rgba(10,12,18,.82); display: grid; place-items: center; z-index: 30; padding: 24px; cursor: zoom-out; }
.lightbox img { max-width: 100%; max-height: 100%; border-radius: 10px; }

/* ===== 画龙 skin ===== */
body {
  background:
    radial-gradient(900px 520px at 88% -8%, rgba(143,132,255,.24), transparent 62%),
    radial-gradient(760px 480px at -6% 104%, rgba(255,77,141,.15), transparent 60%),
    radial-gradient(600px 400px at 42% 118%, rgba(111,227,255,.10), transparent 60%),
    var(--bg);
  background-attachment: fixed;
}
.app { position: relative; }
.app::before {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: -1;
  background-image: radial-gradient(rgba(255,255,255,.075) 1px, transparent 1.3px); background-size: 16px 16px;
  -webkit-mask-image: linear-gradient(115deg, #000 0%, transparent 36%, transparent 64%, #000 100%);
  mask-image: linear-gradient(115deg, #000 0%, transparent 36%, transparent 64%, #000 100%);
}
::selection { background: rgba(143,132,255,.5); }
h1, h2, h3, h4, .brand b, .nav .num, .btn.primary {
  font-family: var(--display); font-weight: 700; font-synthesis: none; letter-spacing: .04em;
}
a.btn { text-decoration: none; }
.top h1 { font-size: 32px; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; display: inline-block; padding-right: .1em; }
.card h3 { font-size: 18px; }
.sec-head h3 { font-size: 22px; }

.side {
  background: linear-gradient(180deg, rgba(29,34,70,.94), rgba(15,18,40,.94));
  box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,.07);
}
.logo { width: 52px; height: 52px; border-radius: 16px; overflow: hidden;
  background: radial-gradient(circle at 30% 20%, #3A2E8F, #171A3A 72%);
  box-shadow: 0 0 0 1px rgba(124,235,255,.4), 0 6px 20px rgba(111,227,255,.28); }
.logo svg { width: 46px; height: 42px; }
.brand b { font-size: 20px; display: flex; align-items: baseline; gap: 2px; white-space: nowrap; }
.brand b i { font-family: var(--brush); font-style: normal; font-weight: 400; font-size: 31px; line-height: 1; letter-spacing: 0;
  background: var(--grad-warm); -webkit-background-clip: text; background-clip: text; color: transparent; padding: 2px 2px 0; }
.nav button { border-radius: 12px; padding: 10px; color: var(--muted); transition: background .15s, color .15s, transform .15s; }
.nav button:hover { background: rgba(255,255,255,.06); color: var(--fg); transform: translateX(2px); }
.nav button.on { background: linear-gradient(90deg, rgba(111,227,255,.22), rgba(143,132,255,.09) 70%, transparent); color: var(--fg); box-shadow: inset 0 0 0 1px rgba(111,227,255,.3); }
.nav .num { border-radius: 0; width: 25px; height: 22px; font-size: 13px;
  clip-path: polygon(25% 0, 75% 0, 100% 50%, 75% 100%, 25% 100%, 0 50%); }
.nav .num.done { background: var(--ok); color: #062015; }
.nav .num.doing { background: var(--warn); color: #2A1B00; }
.nav button.on .num { background: var(--grad); color: var(--ink); }
.pitem.on { background: var(--surface-2); border-color: rgba(124,235,255,.32); }
.tag-demo { color: var(--brand-2); }

.card { border-radius: 16px; background: linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,0) 120px), var(--surface); }
.hero { position: relative; overflow: hidden; padding: 26px; border-color: rgba(124,235,255,.3);
  background: linear-gradient(120deg, rgba(111,227,255,.12), rgba(143,132,255,.11) 45%, rgba(255,77,141,.11)), var(--surface); }
.hero::before { content: ""; position: absolute; inset: 0; pointer-events: none;
  background: repeating-linear-gradient(115deg, transparent 0 22px, rgba(255,255,255,.028) 22px 24px); }
.hero-grid { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 270px); gap: 30px; align-items: center; }
.hero-main { min-width: 0; }
.hero h2 { font-size: 36px; line-height: 1.2; }
.eyebrow { display: inline-block; font-family: var(--brush); font-size: 21px; letter-spacing: .12em; margin-bottom: 4px;
  background: var(--grad-warm); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero-side { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.hero-art { position: relative; border-radius: 18px; overflow: hidden; aspect-ratio: 9 / 11; background: #1B1550;
  border: 1px solid rgba(124,235,255,.38); transform: rotate(1.6deg);
  box-shadow: 0 18px 50px rgba(0,0,0,.5), 0 0 44px rgba(143,132,255,.28); }
.hero-art svg, .hero-art img { width: 100%; height: 100%; display: block; object-fit: cover; }
.hero-art img { cursor: zoom-in; }
.art-tag { position: absolute; left: 10px; bottom: 10px; font-size: 11.5px; color: #fff; background: rgba(8,10,30,.62); padding: 2px 10px; border-radius: 999px; }
.hero-tools { justify-content: center; gap: 6px; }
.scene .float { animation: floaty 5s ease-in-out infinite; }
.scene .tw { animation: twinkle 2.6s ease-in-out infinite; }
.scene .tw:nth-child(2n) { animation-delay: 1.2s; }
@keyframes floaty { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
@keyframes twinkle { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }


.btn { background: var(--surface-2); border-radius: 10px; transition: transform .12s, box-shadow .15s, border-color .15s, background .15s, filter .15s; }
.btn:hover { background: #272D5A; border-color: rgba(124,235,255,.55); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--grad); border-color: transparent; color: var(--ink); font-size: 15px; box-shadow: 0 6px 20px rgba(143,132,255,.38); }
.btn.primary:hover { background: var(--grad); border-color: transparent; filter: brightness(1.1); box-shadow: 0 8px 28px rgba(111,227,255,.5); }
.btn.primary:disabled { box-shadow: none; filter: grayscale(.7); }
.btn.ghost { background: none; border-color: transparent; }
.btn.danger { background: var(--danger-soft); border-color: transparent; }
input[type=text], input[type=number], input[type=password], select, textarea {
  width: 100%; border: 1px solid var(--line); background: var(--well); border-radius: 10px; padding: 8px 11px; color: var(--fg); }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(111,227,255,.2); }
input[type=file] { color: var(--muted); }
.name-input:hover, .name-input:focus { background: var(--well); }

.chip { background: rgba(20,24,48,.85); }
.chip.on { border-color: rgba(111,227,255,.42); }
.chip.on i { box-shadow: 0 0 8px var(--ok); }
.pill { font-weight: 600; }
.choice { background: #10142C; transition: border-color .15s, box-shadow .15s; }
.choice.on { background: linear-gradient(160deg, rgba(111,227,255,.15), rgba(143,132,255,.11)); border-color: var(--accent);
  box-shadow: 0 0 0 1px rgba(111,227,255,.3), 0 8px 26px rgba(111,227,255,.15); }
.choice textarea { background: var(--well); }
.code { background: var(--well); border: 1px solid var(--line); }
.shot, .pcard, .slot, details.guide { background: rgba(16,20,44,.62); }
.pcard.gen { box-shadow: 0 0 0 1px rgba(75,227,160,.22); }
.job, .imgjob { border: 1px dashed rgba(111,227,255,.55); background: linear-gradient(90deg, rgba(111,227,255,.13), rgba(143,132,255,.11)); }
.mini { width: 26px; height: 24px; flex: none; }
.timeline .ai { background: var(--grad); }
.seg { background: var(--well); }
.seg label.on { background: var(--grad); color: var(--ink); }
.thumb, .vid { background: var(--well); }
.bar { border-top: 1px solid var(--line); padding-top: 12px; }
#toast { background: var(--grad); color: var(--ink); font-weight: 700; box-shadow: 0 8px 30px rgba(0,0,0,.45); }
@media (prefers-reduced-motion: reduce) {
  .scene .float, .scene .tw { animation: none; }
  .nav button, .btn { transition: none; }
}
@media (max-width: 860px) {
  .hero-grid { grid-template-columns: minmax(0, 1fr); }
  .hero-art { max-width: 250px; margin: 0 auto; width: 100%; }
  .hero h2 { font-size: 27px; }
}

/* ===== 闭环与创新：灵感池 / 观众试映 / 钩子对照 / 画龙点睛 / 数据复盘 / 经验库 ===== */
.tag { display: inline-flex; align-items: center; font-size: 12px; font-weight: 500; font-family: var(--font); letter-spacing: 0; border-radius: 6px; padding: 0 7px; background: var(--surface-2); color: var(--muted); white-space: nowrap; flex: none; }
.viewers { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.viewer { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: rgba(16,20,44,.62); display: flex; flex-direction: column; gap: 4px; min-width: 0; font-size: 13px; }
.viewer b { font-size: 14px; }
.viewer .who { color: var(--muted); font-size: 12px; }
.viewer .pill { align-self: flex-start; }
.ret { width: 100%; height: auto; display: block; max-width: 720px; }
.ret text { fill: var(--muted); font-size: 11px; font-family: var(--font); }
.ret .grid { stroke: var(--line); stroke-width: 1; }
.ret .line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; }
.ret .area { fill: var(--accent); opacity: .1; }
.ret .dot { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
.ret .hit { fill: transparent; cursor: help; }
.ret .val { fill: var(--fg); font-size: 12px; font-weight: 600; }
.fixbox { border-left: 3px solid var(--brand-2); background: var(--well); border-radius: 0 10px 10px 0; padding: 10px 14px; display: flex; flex-direction: column; gap: 6px; }
.fixbox del { color: var(--muted); }
.fixbox ins { text-decoration: none; color: var(--fg); font-weight: 600; }
.ab { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.ab-col { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; background: rgba(16,20,44,.62); display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.ab-col.win { border-color: var(--ok); box-shadow: 0 0 0 1px rgba(75,227,160,.22); }
.ab-col h4 { font-size: 16px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.eye { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 20px; align-items: start; }
.eye-score { width: 108px; aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; text-align: center;
  background: radial-gradient(circle at 35% 30%, #3A2E8F, #171A3A 72%); border: 2px solid var(--brand-2); box-shadow: 0 0 28px rgba(255,181,71,.25); }
.eye-score b { font-family: var(--display); font-size: 40px; line-height: 1; display: block; }
.eye-score span { font-size: 11.5px; color: var(--muted); display: block; }
.eye-score .mini { width: 40px; height: 36px; margin: 0 auto 2px; display: block; }
.autochecks { display: flex; flex-direction: column; gap: 4px; }
.ac { display: flex; gap: 8px; align-items: baseline; font-size: 13.5px; flex-wrap: wrap; }
.ac i { font-style: normal; flex: none; width: 1.2em; text-align: center; font-weight: 700; }
.ac.ok i { color: var(--ok); } .ac.bad i { color: var(--warn); }
.ac span { color: var(--muted); font-size: 12.5px; }
.statgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 10px; }
.items { display: flex; flex-direction: column; gap: 8px; }
.item { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: rgba(16,20,44,.62); }
.item .body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.item.off { opacity: .55; }
.item textarea { min-height: 2.6em; }
.item > .tag { margin-top: 3px; }
.item > input[type=checkbox] { width: 17px; height: 17px; margin-top: 4px; accent-color: var(--ok); flex: none; }
.tbl-wrap { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th, .tbl td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl th { color: var(--muted); font-weight: 500; font-size: 12.5px; }
.tbl .n { text-align: right; font-variant-numeric: tabular-nums; }
.tbl td:first-child { white-space: normal; min-width: 140px; }
.bars { display: flex; flex-direction: column; gap: 8px; }
.bar-row { display: grid; grid-template-columns: 96px minmax(0, 1fr) 104px; gap: 10px; align-items: center; font-size: 13px; }
.bar-row .track { height: 14px; }
.bar-row .fill { height: 100%; background: var(--accent); border-radius: 0 4px 4px 0; min-width: 2px; }
.bar-row .v { font-variant-numeric: tabular-nums; }
.bar-row .v span { color: var(--muted); font-size: 12px; }
ul.plain { margin: 4px 0 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
.newform select { flex: 0 0 auto; width: auto; }
.hero-main .btn { max-width: 100%; white-space: normal; text-align: left; }
@media (max-width: 860px) {
  .ab, .eye { grid-template-columns: minmax(0, 1fr); }
  .eye-score { margin: 0 auto; }
  .bar-row { grid-template-columns: 72px minmax(0, 1fr) 92px; }
}

/* ===== 工具箱：接单助手 / 媒体提取 / 论文转换 ===== */
.nav-cap { font-size: 11.5px; color: var(--muted); padding: 2px 10px 0; letter-spacing: .08em; }
.nav button { position: relative; }
.nav .tdot { position: absolute; right: 10px; top: 50%; margin-top: -4px; }
.tdot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; vertical-align: 1px; margin-right: 6px; }
.tdot.ready { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
.tdot.starting { background: var(--warn); }
.tdot.error, .tdot.stopped { background: var(--danger); }
.toolframes { display: flex; flex-direction: column; min-width: 0; }
.toolframe { width: 100%; height: calc(100vh - 210px); min-height: 560px; border: 1px solid var(--line); border-radius: 16px; background: #fff; display: block; }
.tool-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 14px; }
.tool-state { text-align: center; padding: 36px 20px; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.tool-state p { color: var(--muted); max-width: 60ch; }
.tool-state.error h3 { color: var(--warn); }
.spin { width: 28px; height: 28px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--accent); animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
.ord-images { display: flex; flex-direction: column; gap: 8px; }
.ord-img { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; background: var(--well); min-width: 0; }
.ord-img img { width: 52px; height: 52px; object-fit: cover; border-radius: 6px; flex: none; }
.ord-img span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
.seg .seg-btn { border: 0; background: none; padding: 7px 14px; cursor: pointer; font-size: 13.5px; color: inherit; }
.seg .seg-btn.on { background: var(--grad); color: var(--ink); font-weight: 600; }
.seg input:disabled + * , .seg label:has(input:disabled) { opacity: .6; cursor: not-allowed; }
.drop.busy { opacity: .6; pointer-events: none; }
#ord-error:empty { display: none; }
.fixbox code { font-family: var(--mono); background: var(--surface-2); padding: 0 5px; border-radius: 4px; }
/* ===== 结构整理：分组导航、当前项目、首页 ===== */
.proj { display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--well); }
.proj label { font-size: 11.5px; color: var(--muted); letter-spacing: .08em; }
.proj .psel { display: block; flex: 1; min-width: 0; font-weight: 600; }
.nav-cap { display: block; margin: 12px 0 2px; padding: 0 10px; font-size: 11.5px; color: var(--muted); letter-spacing: .1em; }
.nav-cap:first-of-type { margin-top: 6px; }
.continue { margin-top: 16px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: rgba(10,12,28,.45); display: flex; flex-direction: column; gap: 10px; }
.continue b { font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.stepbar { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.stepbar button { border: 0; border-radius: 8px; padding: 6px 2px; font-size: 12px; cursor: pointer; color: var(--muted); background: var(--surface-2); display: flex; flex-direction: column; align-items: center; gap: 2px; white-space: nowrap; overflow: hidden; }
.stepbar button b { font-family: var(--display); font-size: 13px; }
.stepbar button:hover { color: var(--fg); outline: 1px solid var(--accent); }
.stepbar .seg-done { background: var(--ok-soft); color: var(--ok); }
.stepbar .seg-doing { background: var(--warn-soft); color: var(--warn); }
.stepbar.sm { gap: 3px; }
.stepbar.sm span { height: 6px; border-radius: 3px; background: var(--surface-2); }
.stepbar.sm .seg-done { background: var(--ok); }
.stepbar.sm .seg-doing { background: var(--warn); }
.projects { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.projcard { text-align: left; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); padding: 14px 16px; cursor: pointer; display: flex; flex-direction: column; gap: 10px; color: inherit; transition: transform .15s, border-color .15s; min-width: 0; }
.projcard:hover { transform: translateY(-2px); border-color: var(--accent); }
.projcard.on { border-color: rgba(124,235,255,.55); box-shadow: 0 0 0 1px rgba(124,235,255,.25); }
.projcard b { font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.home-foot { margin-top: 4px; }
.banner.hint { background: rgba(255,196,87,.08); border: 1px dashed rgba(255,196,87,.45); }
.linkish { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; font: inherit; text-decoration: underline; text-underline-offset: 3px; }
@media (max-width: 860px) {
  .nav-cap { display: none; }
  .stepbar button { font-size: 11px; }
}
@media (prefers-reduced-motion: reduce) { .projcard { transition: none; } }

/* 模型库 / 任务分配 / 模型擂台 */
.pv { border: 1px solid var(--line); border-radius: 12px; background: rgba(16,20,44,.62); min-width: 0; }
.pv.open { border-color: rgba(124,235,255,.45); }
.pv-head { width: 100%; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: none; border: 0; padding: 10px 14px; cursor: pointer; text-align: left; color: inherit; }
.pv-body { padding: 0 14px 14px; display: flex; flex-direction: column; gap: 10px; }
.assign { display: flex; flex-direction: column; gap: 10px; }
.assign-row { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) minmax(0, 1fr); gap: 10px; align-items: center; border-bottom: 1px solid var(--line); padding-bottom: 10px; }
.assign-row > span:first-child { display: flex; flex-direction: column; gap: 2px; }
.arena-picks { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 6px; }
.toggle.off { opacity: .5; }
.arena { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
.arena-col { display: flex; flex-direction: column; gap: 10px; }
.arena-col.win { border-color: var(--ok); box-shadow: 0 0 0 1px rgba(75,227,160,.25); }
.arena-script { white-space: pre-wrap; font-size: 13.5px; background: var(--well); border-radius: 9px; padding: 10px 12px; max-height: 360px; overflow: auto; }
@media (max-width: 860px) { .assign-row { grid-template-columns: minmax(0, 1fr); } }

@media (max-width: 1100px) {
  .choices, .guide-cols { grid-template-columns: minmax(0, 1fr); }
  .grid3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 860px) {
  .rc-wrap { grid-template-columns: minmax(0, 1fr); }
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { position: static; max-height: none; padding: 14px; gap: 12px; }
  .nav { flex-direction: row; overflow-x: auto; gap: 4px; padding-bottom: 2px; }
  .nav button { width: auto; flex: none; white-space: nowrap; }
  .side-sec, .plist-wrap { display: none; }
  .psel { display: block; }
  .side-foot { flex-direction: row; flex-wrap: wrap; }
  .grid2, .grid3 { grid-template-columns: minmax(0, 1fr); }
  .span2 { grid-column: auto; }
  .top h1 { font-size: 22px; }
}

body {
  background:
    radial-gradient(1100px 620px at 92% -10%, rgba(242,201,107,.16), transparent 60%),
    radial-gradient(800px 520px at -8% 110%, rgba(70,96,190,.20), transparent 62%),
    linear-gradient(180deg, #081030, #060A1A 55%);
  background-attachment: fixed;
}
/* 整页背后：主题图压暗，只在右侧露出一点金光 */
.app::before {
  background: linear-gradient(90deg, #060A1A 38%, rgba(6,10,26,.9) 62%, rgba(6,10,26,.72)), var(--celestial) right top / cover no-repeat;
  -webkit-mask-image: none; mask-image: none; opacity: .9;
}
.app::after {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: -1;
  background-image: radial-gradient(rgba(255,236,190,.55) 1px, transparent 1.4px), radial-gradient(rgba(255,255,255,.35) 1px, transparent 1.2px);
  background-size: 140px 140px, 90px 90px; background-position: 20px 30px, 70px 10px; opacity: .35;
}
::selection { background: rgba(242,201,107,.4); color: #fff; }
h1, h2, h3, h4, .brand b, .nav .num, .btn.primary { letter-spacing: .06em; }
.top h1 { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; filter: drop-shadow(0 0 14px rgba(242,201,107,.25)); }
.card h3, .sec-head h3 { color: #FBEBC0; }

.side { background: linear-gradient(180deg, rgba(20,27,60,.92), rgba(8,12,32,.94)); border-color: var(--gold-line); box-shadow: var(--shadow), inset 0 1px 0 rgba(255,236,190,.12); }
.logo { background: radial-gradient(circle at 30% 20%, #4B3A12, #0E1430 72%); box-shadow: 0 0 0 1px rgba(242,201,107,.55), 0 6px 22px rgba(242,190,90,.32); }
.nav button.on { background: linear-gradient(90deg, rgba(242,201,107,.22), rgba(242,201,107,.06) 70%, transparent); color: #FFF3D0; box-shadow: inset 0 0 0 1px rgba(242,201,107,.38); }
.nav button.on .ico { color: var(--accent); }
.nav-cap { color: #CDB680; }
.pitem.on, .proj { border-color: var(--gold-line); }

.card { border-color: rgba(242,201,107,.2); background: linear-gradient(180deg, rgba(255,236,190,.05), rgba(255,236,190,0) 140px), rgba(14,20,48,.92); }
.hero { min-height: 340px; padding: 30px; border-color: var(--gold-line);
  background: linear-gradient(90deg, rgba(6,10,26,.97) 0%, rgba(6,10,26,.9) 34%, rgba(6,10,26,.45) 58%, rgba(6,10,26,.05) 80%), var(--celestial) right 22% / cover no-repeat, var(--surface);
  box-shadow: var(--shadow), 0 0 60px rgba(242,190,90,.12); }
.hero::before { background: radial-gradient(420px 300px at 80% 20%, rgba(255,226,150,.18), transparent 70%); }
.hero-grid { grid-template-columns: minmax(0, 1fr); }
.hero-main { max-width: min(600px, 56%); }
.hero-side { display: none; }
.hero h2 { color: #FFF6DC; text-shadow: 0 2px 20px rgba(0,0,0,.6); }
.hero p { color: #D9D2BC; }
.eyebrow { letter-spacing: .16em; }
.continue { background: rgba(6,10,26,.72); border-color: var(--gold-line); backdrop-filter: blur(4px); }

.btn { background: rgba(24,32,63,.9); border-color: #343B63; }
.btn:hover { background: #222B52; border-color: rgba(242,201,107,.6); }
.btn.primary { background: var(--grad); color: var(--ink); box-shadow: 0 6px 22px rgba(242,190,90,.35), inset 0 1px 0 rgba(255,255,255,.5); }
.btn.primary:hover { background: var(--grad); box-shadow: 0 8px 30px rgba(255,214,120,.5), inset 0 1px 0 rgba(255,255,255,.5); }
input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(242,201,107,.18); }
.chip { background: rgba(14,20,48,.85); }
.chip.on { border-color: var(--gold-line); color: var(--accent); }
.choice { background: #0B1129; }
.choice.on { background: linear-gradient(160deg, rgba(242,201,107,.16), rgba(242,201,107,.05)); border-color: var(--accent); box-shadow: var(--gold-glow); }
.job, .imgjob { border-color: rgba(242,201,107,.55); background: linear-gradient(90deg, rgba(242,201,107,.12), rgba(242,201,107,.04)); }
.shot, .pcard, .slot, details.guide, .item, .viewer, .ab-col, .pv { background: rgba(11,17,41,.72); }
.pv.open { border-color: rgba(242,201,107,.5); }
.projcard { background: rgba(14,20,48,.85); }
.projcard:hover { border-color: var(--accent); box-shadow: var(--gold-glow); }
.projcard.on { border-color: rgba(242,201,107,.6); box-shadow: 0 0 0 1px rgba(242,201,107,.25); }
.stepbar button { background: #151C3B; }
.eye-score { background: radial-gradient(circle at 35% 30%, #4B3A12, #0E1430 72%); }
.banner { background: rgba(255,159,90,.1); border: 1px solid rgba(255,159,90,.35); }
.banner.hint { background: rgba(242,201,107,.07); border: 1px dashed rgba(242,201,107,.45); color: #F4D58A; }
.tool-bar { background: rgba(14,20,48,.9); }
#toast { box-shadow: 0 8px 30px rgba(0,0,0,.45), 0 0 24px rgba(242,190,90,.35); }
@media (max-width: 860px) {
  .hero { min-height: 0; padding: 22px 18px;
    background: linear-gradient(180deg, rgba(6,10,26,.55) 0%, rgba(6,10,26,.9) 46%, rgba(6,10,26,.97) 100%), var(--celestial) 72% top / auto 300px no-repeat, var(--surface); padding-top: 170px; }
  .hero-main { max-width: none; }
}
/* @theme-end */
</style>

<script>
(function () {
'use strict';

/* ---------- helpers ---------- */
var $ = function (s) { return document.querySelector(s); };
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function clone(o) { return JSON.parse(JSON.stringify(o)); }
function uid() { return 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }
var toastTimer;
function toast(t) {
  var el = $('#toast'); el.textContent = t; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(function () { el.classList.remove('show'); }, 1800);
}
function ago(ts) {
  var d = (Date.now() - ts) / 1000;
  if (d < 60) return '刚刚';
  if (d < 3600) return Math.floor(d / 60) + ' 分钟前';
  if (d < 86400) return Math.floor(d / 3600) + ' 小时前';
  return Math.floor(d / 86400) + ' 天前';
}

/* ---------- constants ---------- */

function stepStatus(p, key) {
  switch (key) {
    case 'brief': return p.brief.topic.trim() ? 'done' : 'todo';
    case 'copy': return p.script.trim() ? 'done' : (p.hooks.length ? 'doing' : 'todo');
    case 'board': return p.shots.length ? 'done' : 'todo';
    case 'prompts':
      if (!p.prompts.length) return 'todo';
      return p.prompts.every(function (x) { return p.gen[String(x.no)]; }) ? 'done' : 'doing';
    case 'edit':
      if (p.editDone) return 'done';
      return (p.editPlan.trim() || Object.keys(p.editChecks).some(function (k) { return p.editChecks[k]; })) ? 'doing' : 'todo';
    case 'publish':
      if (p.published) return 'done';
      return (p.pub && p.pub.titles && p.pub.titles.length) ? 'doing' : 'todo';
    case 'review':
      if (p.review) return 'done';
      return hasStats(p) ? 'doing' : 'todo';
  }
  return 'todo';
}
var STATUS_TXT = { todo: '未开始', doing: '进行中', done: '已完成' };
function nextStep(p) {
  for (var i = 0; i < STEPS.length; i++) if (stepStatus(p, STEPS[i].key) !== 'done') return STEPS[i];
  return STEPS[STEPS.length - 1];
}

/* ---------- storage ----------
   Projects live in IndexedDB (room for thousands of projects). localStorage is only the fallback when
   IndexedDB is unavailable; it holds about 5MB, roughly 300 full projects. Writes are debounced so typing
   never waits on serialising every project. */
var dataP = null; S.idbOk = false; var localTimer = null; var storeWarned = false;
function dataDb() {
  if (!dataP) dataP = new Promise(function (res, rej) {
    if (!window.indexedDB) { rej(new Error('no idb')); return; }
    var r = indexedDB.open('svd-data', 1);
    r.onupgradeneeded = function () { r.result.createObjectStore('kv'); };
    r.onsuccess = function () { res(r.result); };
    r.onerror = function () { rej(r.error); };
    r.onblocked = function () { rej(new Error('blocked')); };
  });
  return dataP;
}
function kvGet(k) {
  return dataDb().then(function (db) {
    return new Promise(function (res, rej) { var q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = function () { res(q.result); }; q.onerror = function () { rej(q.error); }; });
  });
}
function kvSet(k, v) {
  return dataDb().then(function (db) {
    return new Promise(function (res, rej) {
      var tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k);
      tx.oncomplete = function () { res(); }; tx.onerror = function () { rej(tx.error); }; tx.onabort = function () { rej(tx.error); };
    });
  });
}
function storeFail() {
  S.storageNote = '浏览器存储空间不够，最新改动没保存上。请到「其他设置」导出备份，再删掉不用的旧项目。';
  renderBar();
  if (!storeWarned) { storeWarned = true; toast('存储空间不够，改动没保存上'); }
}
function writeLocal() {
  clearTimeout(localTimer); localTimer = null;
  var snap = S.projects;
  if (S.idbOk) {
    return kvSet('projects', JSON.parse(JSON.stringify(snap))).then(function () {
      if (lsGet('svd.projects') != null) { try { localStorage.removeItem('svd.projects'); } catch (e) {} } /* migrated */
      if (storeWarned) { storeWarned = false; S.storageNote = ''; renderBar(); }
    }, function () { if (!lsSet('svd.projects', JSON.stringify(snap))) storeFail(); });
  }
  if (!lsSet('svd.projects', JSON.stringify(snap))) storeFail();
  return Promise.resolve();
}
function saveLocal(now) { if (now) return writeLocal(); clearTimeout(localTimer); localTimer = setTimeout(writeLocal, 500); }
function pendingSave() { if (localTimer) writeLocal(); }
function loadLocal() {
  var fromLs = function () { try { var raw = lsGet('svd.projects'); return raw ? JSON.parse(raw) : null; } catch (e) { return null; } };
  return kvGet('projects').then(function (v) {
    S.idbOk = true;
    if (Array.isArray(v)) { S.projects = v.map(normalize); return; }
    var old = fromLs(); /* first run after the update: move projects out of localStorage */
    if (old) { S.projects = old.map(normalize); return writeLocal(); }
  }, function () {
    S.idbOk = false; var old = fromLs(); S.projects = old ? old.map(normalize) : [];
  });
}
window.addEventListener('pagehide', pendingSave);
document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') pendingSave(); });
var dirty = {}; var saveTimer = null; var saveChain = Promise.resolve();
function touch(p) {
  if (!p || p.demo) return;
  p.updated = Date.now(); dirty[p.id] = true; saveLocal();
  if (S.storage === 'cloud') { S.saveState = 'pending'; renderBar(); }
  clearTimeout(saveTimer); saveTimer = setTimeout(flush, 900);
}
function flush() {
  saveChain = saveChain.then(function () {
    if (S.storage !== 'cloud' || !dbCol) { dirty = {}; return; }
    var ids = Object.keys(dirty); dirty = {};
    S.saveState = 'saving'; renderBar();
    return ids.reduce(function (chain, id) {
      return chain.then(function () {
        var p = S.projects.find(function (x) { return x.id === id; });
        if (!p) return;
        return dbCol.doc(id).set(clone(p)).catch(dbError);
      });
    }, Promise.resolve()).then(function () { S.saveState = 'saved'; renderBar(); });
  });
}
function dbError(e) {
  var code = e && e.code;
  if (code === 'quota_exceeded') S.storageNote = '云端空间满了，删掉几个旧项目再试；内容仍保存在本浏览器。';
  else if (code === 'revoked' || code === 'not_granted' || code === 'invalid_argument') { S.storage = 'local'; S.storageNote = '没法写入云端，先保存在本浏览器。'; }
  else S.storageNote = '同步失败，稍后会在你下次修改时重试；内容已保存在本浏览器。';
  renderBar();
}
function initStorage() {
  loadLocal().then(initCloud, initCloud);
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {} /* ask the browser not to evict our data */
}
function initCloud() {
  var C = window.claude;
  if (!C || typeof C.use !== 'function') { S.loading = false; render(); return; }
  Promise.all([C.use('db'), C.use('user')]).then(function (r) {
    var db = r[0], user = r[1];
    if (!db || !user) throw { code: 'none' };
    return user.id().then(function (id) {
      if (!id) throw { code: 'none' };
      dbCol = db.collection('data/users/' + id);
      var slow = setTimeout(function () { S.storageNote = '云端暂时连不上，先显示本浏览器里的项目。'; S.loading = false; render(); }, 10000);
      return dbCol.get().then(function (snap) {
        clearTimeout(slow);
        var remote = {}; var remoteBrain = null;
        snap.docs.forEach(function (d) {
          if (!d.exists) return;
          var v = clone(d.data());
          if (v && v.kind === 'brain') remoteBrain = v;
          else if (v && v.id) remote[v.id] = normalize(v);
        });
        if (remoteBrain && (Number(remoteBrain.updated) || 0) > S.brain.updated) { S.brain = normBrain(remoteBrain); lsSet('svd.brain', JSON.stringify(S.brain)); }
        else if (S.brain.updated) dbCol.doc('brain').set(clone(S.brain)).catch(dbError);
        var merged = {}; var toUpload = [];
        Object.keys(remote).forEach(function (k) { merged[k] = remote[k]; });
        S.projects.forEach(function (lp) {
          if (!merged[lp.id] || (lp.updated || 0) > (merged[lp.id].updated || 0)) { merged[lp.id] = lp; toUpload.push(lp.id); }
        });
        S.projects = Object.keys(merged).map(function (k) { return merged[k]; });
        S.storage = 'cloud'; S.storageNote = ''; S.loading = false; S.saveState = 'saved';
        saveLocal();
        toUpload.forEach(function (id) { dirty[id] = true; });
        if (toUpload.length) flush();
        render();
      });
    });
  }).catch(function (e) {
    S.loading = false;
    if (e && e.code && e.code !== 'none') dbError(e);
    render();
  });
}

var ERR = {

  bad_key: 'API Key 不对或已失效，去「模型与分工」检查。',
  quota: '模型额度不够或请求太频繁，去这家模型的后台看看余额，或过一会儿再试。',
  agent: '本机 Codex 没有完成，请稍后重试。',
  model: '接口不认识这个模型名，去「模型与分工」点「测试连接」看看可用的模型。',
  network: '连不上接口地址。国内直连 api.openai.com 通常不通，需要能访问的网络或可用的中转地址。',

};
function errText(e) {
  var code = e && e.code;
  if (code === 'agent' && e.message) return e.message;
  if (ERR[code]) return ERR[code] + (code === 'model' && e.message ? '（' + e.message + '）' : '');
  if (e && e.message) return '出错了：' + String(e.message).slice(0, 120);
  return '生成中断了，再试一次。';
}
function aiRun(key, prompt, asJson, onDone, global) {
  var task = JOB_TASK[key] || 'copy';
  if (!taskReady(task) || jobs[key]) return;
  var p = cur();
  var ctl = new AbortController();
  jobs[key] = { ctl: ctl, text: '', pid: p.id, who: pvName(pvFor(task)) };
  render();
  var opts = { signal: ctl.signal, cache: false, task: task, onText: function (u) { if (jobs[key]) { jobs[key].text = u.text; updateJob(key, asJson); } } };
  var call = textCall(prompt, asJson, opts);
  call.then(function (res) {
    delete jobs[key];
    var target = global ? null : (p.demo ? S.demo : S.projects.find(function (x) { return x.id === p.id; }));
    if (!target && !global) { render(); return; }
    try { onDone(target, res); if (target) touch(target); } catch (err) { toast('返回内容不完整，再点一次重新生成'); }
    render();
  }, function (e) {
    delete jobs[key];
    var code = e && e.code;
    toast(code === 'cancelled' ? '已停止' : errText(e));
    render();
  });
}
function jobHTML(key, asJson) {

function jobPreview(t, asJson) {

}

/* ---------- 观众试映 / 钩子对照 / 画龙点睛 ---------- */
function retChart(sc) {
  var n = sc.viewers.length || 1;
  var total = Math.max(Number(sc.total) || 0, 1);
  sc.viewers.forEach(function (v) { if (v.leaveAt > total) total = v.leaveAt; });
  var X0 = 44, X1 = 596, Y0 = 16, Y1 = 146;
  function x(t) { return (X0 + (X1 - X0) * t / total).toFixed(1); }
  function y(v) { return (Y1 - (Y1 - Y0) * v / 100).toFixed(1); }
  var left = sc.viewers.filter(function (v) { return v.leaveAt >= 0; }).sort(function (a, b) { return a.leaveAt - b.leaveAt; });
  var cur = 100, pts = [[0, 100]], dots = '';
  left.forEach(function (v) {
    pts.push([v.leaveAt, cur]); cur = Math.max(0, cur - 100 / n); pts.push([v.leaveAt, cur]);
    dots += '<circle class="dot" cx="' + x(v.leaveAt) + '" cy="' + y(cur) + '" r="4.5"/><circle class="hit" cx="' + x(v.leaveAt) + '" cy="' + y(cur) + '" r="14"><title>' + esc('第 ' + v.leaveAt + ' 秒，' + v.name + '划走：' + v.reason) + '</title></circle>';
  });
  pts.push([total, cur]);
  var d = pts.map(function (q, i) { return (i ? 'L' : 'M') + x(q[0]) + ' ' + y(q[1]); }).join('');
  var h = '<svg class="ret" viewBox="0 0 640 172" role="img" aria-label="' + esc('模拟留存曲线：' + sc.viewers.length + ' 位观众，' + Math.round(cur) + '% 看到最后') + '">';
  [0, 50, 100].forEach(function (g) { h += '<line class="grid" x1="' + X0 + '" x2="' + X1 + '" y1="' + y(g) + '" y2="' + y(g) + '"/><text x="' + (X0 - 8) + '" y="' + (Number(y(g)) + 4) + '" text-anchor="end">' + g + '%</text>'; });
  h += '<path class="area" d="' + d + 'L' + X1 + ' ' + Y1 + 'L' + X0 + ' ' + Y1 + 'Z"/><path class="line" d="' + d + '"/>' + dots;
  h += '<text class="val" x="' + (X1 + 6) + '" y="' + (Number(y(cur)) + 4) + '">' + Math.round(cur) + '%</text>';
  h += '<text x="' + X0 + '" y="166">0 秒</text><text x="' + ((X0 + X1) / 2) + '" y="166" text-anchor="middle">' + Math.round(total / 2) + ' 秒</text><text x="' + X1 + '" y="166" text-anchor="end">' + total + ' 秒</text>';
  return h + '</svg>';
}

var HUB_ORIGIN = 'http://127.0.0.1:43129';

function hubRefresh() {
  if (!HUB || HT.loading) return Promise.resolve();
  HT.loading = true;
  return fetch('/api/tools', { cache: 'no-store' }).then(function (res) { if (!res.ok) throw new Error('tools'); return res.json(); }).then(function (data) {
    var next = (data && data.tools) || [];

      if (t.state === 'ready') { delete HT.requested[t.id]; delete HT.localFail[t.id]; }
      else if (t.state === 'idle' && HT.localFail[t.id]) { t.state = 'error'; t.message = HT.localFail[t.id]; }
    });
    var changed = JSON.stringify(next) !== JSON.stringify(HT.tools) || HT.offline;

    var t = hubTool(S.view);
    if (t && S.view !== 'orders' && t.state === 'idle' && !HT.requested[t.id]) hubStart(t.id);

  }).then(function () { HT.loading = false; });
}
function hubStart(id) {
  delete HT.localFail[id]; HT.requested[id] = true;

  return fetch('/api/tools/' + encodeURIComponent(id) + '/start', { method: 'POST' }).then(function (res) {
    if (!res.ok) throw new Error('start'); return hubRefresh();

    var active = HUB && !HT.offline && S.view === id && !!t && t.state === 'ready';
    if (f && t && t.state === 'ready' && f.getAttribute('data-gen') !== String(t.generation || 0)) { f.src = t.url; f.setAttribute('data-gen', String(t.generation || 0)); }

  if (!z) { if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) toast('把文件拖到虚线框里'); return; }
  z.classList.remove('over');
  if (z.hasAttribute('data-drop-ord')) { ordAddFiles(e.dataTransfer && e.dataTransfer.files); return; }
  if (z.hasAttribute('data-drop-stats')) { readStats(cur(), z.getAttribute('data-drop-stats'), e.dataTransfer && e.dataTransfer.files); return; }
  var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
  addVideo(cur(), parseInt(z.getAttribute('data-drop-no'), 10), f);
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && !$('#lb').hidden) { $('#lb').hidden = true; $('#lb').innerHTML = ''; }
});
document.addEventListener('input', function (e) {
  var el = e.target;
  if (el.id === 'free-prompt') { freePrompt = el.value; return; }
  var pvb = el.getAttribute && el.getAttribute('data-pv');
  if (pvb) {
    var cut = pvb.indexOf(':'), tp2 = pvById(pvb.slice(0, cut)), fld = pvb.slice(cut + 1);
    if (tp2 && ['name', 'base', 'key', 'model', 'imageModel'].indexOf(fld) >= 0) { tp2[fld] = el.value; delete S.pvTest[tp2.id]; saveCfg(); renderTop(); pvRefreshBits(); }
    return;
  }
  if (el.id === 'ord-order') { S.ord.order = el.value; var oc = $('#ord-count'); if (oc) oc.textContent = el.value.length + ' / 6000'; return; }
  if (el.id === 'ord-extra') { S.ord.extra = el.value; return; }
  if (el.id === 'tear-text') { tearText = el.value; return; }
  if (el.id === 'cmt-text') { cmtText = el.value; return; }
  if (el.id === 'idea-text') { ideaText = el.value; return; }
  var bp = el.getAttribute && el.getAttribute('data-brain');
  if (bp) { setPath(S.brain, bp, el.value); saveBrain(); return; }
  var ck = el.getAttribute && el.getAttribute('data-cfg');
  if (ck) {
    S.cfg[ck] = el.value; saveCfg(); renderTop();
    if (el.tagName === 'SELECT') renderView();
    return;
  }
  var path = el.getAttribute && el.getAttribute('data-bind');
  if (!path) return;
  var p = cur();
  var v = el.value;
  if (el.getAttribute('data-type') === 'num') v = Math.max(1, Math.min(60, parseInt(v, 10) || 1));
  if (el.getAttribute('data-type') === 'stat') {
    var sm = /^\s*(\d+(?:\.\d*)?)\s*(万|w)?/i.exec(v);
    v = sm ? (sm[2] ? String(Math.round(parseFloat(sm[1]) * 10000)) : sm[1]) : '';
  }
  setPath(p, path, v);
  touch(p);
  if (path === 'script') {
    var n = p.script.replace(/\s/g, '').length; var c = $('#script-count');
    if (c) c.textContent = n + ' 字 · 约 ' + Math.round(n / 4.5) + ' 秒（目标 ' + p.brief.duration + ' 秒）';
  }
  if (path === 'name') { p.autoName = false; renderSide(); }
  else if (path === 'brief.topic' && p.autoName) {
    p.name = v.trim().slice(0, 20) || '未命名视频';
    var ni = $('#pname'); if (ni) ni.value = p.name;
    renderSide();
  }
});
document.addEventListener('change', function (e) {
  var el = e.target;
  if (el.id === 'psel') {
    if (el.value === '__new') { go('home'); setTimeout(function () { var t = $('#new-topic'); if (t) t.focus(); }, 0); renderSide(); }
    else { setCurrent(el.value); render(); }
    return;
  }
  if (el.getAttribute && el.getAttribute('data-plat')) { S.cfg.videoPlat = el.getAttribute('data-plat'); saveCfg(); renderView(); return; }
  if (el.getAttribute && el.getAttribute('data-vid-no')) { addVideo(cur(), parseInt(el.getAttribute('data-vid-no'), 10), el.files && el.files[0]); return; }
  if (el.getAttribute && el.hasAttribute('data-gal')) { S.galKind = el.getAttribute('data-gal'); renderView(); return; }
  if (el.getAttribute && el.hasAttribute('data-abpick')) { var ap = cur(); ap.abPick = parseInt(el.getAttribute('data-abpick'), 10); touch(ap); renderView(); return; }
  if (el.getAttribute && el.hasAttribute('data-lesson-on')) {
    var ls = S.brain.lessons[parseInt(el.getAttribute('data-lesson-on'), 10)];
    if (ls) { ls.on = el.checked; saveBrain(); renderView(); }
    return;
  }
  if (el.getAttribute && el.hasAttribute('data-stats-file')) { readStats(cur(), el.getAttribute('data-stats-file'), el.files); el.value = ''; return; }
  if (el.getAttribute && el.getAttribute('data-type') === 'stat') {
    /* re-render after focus has moved on, then put focus back where the user tabbed to */
    setTimeout(function () { var a = document.activeElement; var fid = a && a.id; render(); if (fid) { var nx = document.getElementById(fid); if (nx && nx.focus) nx.focus(); } }, 0);
    return;
  }
  if (el.id === 'hero-file') {
    var hf = el.files && el.files[0]; if (!hf) return;
    if (!/^image\//.test(hf.type)) { toast('请选一张图片'); return; }
    if (hf.size > 20 * 1024 * 1024) { toast('图片太大了，换一张 20MB 以内的'); return; }
    var hr = { id: 'h' + uid(), pid: '_app', kind: 'hero', no: null, prompt: '', blob: hf, created: Date.now() };
    idbTx('readwrite', function (st) { return st.put(hr); }).catch(function () {}).then(function () {
      hr.url = URL.createObjectURL(hf); (S.imgs._app = S.imgs._app || []).unshift(hr);
      S.cfg.heroId = hr.id; saveCfg(); renderView(); toast('主视觉已更换');
    });
    return;
  }
  if (el.id === 'ord-file') { var ofs = Array.prototype.slice.call(el.files || []); el.value = ''; ordAddFiles(ofs); return; }
  if (el.getAttribute && el.hasAttribute('data-pv')) { renderSide(); renderTop(); pvRefreshBits(); return; }
  if (el.getAttribute && el.hasAttribute('data-assign')) { S.cfg.assign[el.getAttribute('data-assign')] = el.value; saveCfg(); render(); return; }
  if (el.getAttribute && el.hasAttribute('data-arenajob')) { S.arena.job = el.getAttribute('data-arenajob'); S.arena.picks = null; S.arena.runs = {}; renderView(); return; }
  if (el.getAttribute && el.hasAttribute('data-arenapick')) {
    var apid = el.getAttribute('data-arenapick'); S.arena.picks = (S.arena.picks || []).filter(function (x) { return x !== apid; });
    if (el.checked) { if (S.arena.picks.length >= 4) { el.checked = false; toast('最多同时比 4 个模型'); } else S.arena.picks.push(apid); }
    renderView(); return;
  }
  if (el.getAttribute && el.hasAttribute('data-arenablind')) { S.arena.blind = el.checked; renderView(); return; }
  if (el.getAttribute && el.hasAttribute('data-ordeng')) { S.cfg.ordersEngine = el.getAttribute('data-ordeng'); saveCfg(); S.ord.error = ''; renderView(); return; }
  if (el.id === 'backup-file') {
    var bf = el.files && el.files[0]; el.value = '';
    if (!bf) return;
    if (bf.size > 80 * 1024 * 1024) { toast('文件太大，不像是工作台的备份'); return; }
    bf.text().then(function (t) {
      var bk = JSON.parse(t);
      if (!bk || bk.app !== 'hualong-workbench' || !Array.isArray(bk.projects)) throw new Error('bad');
      importBackup(bk);
    }).catch(function () { toast('这个文件不是画龙工作台的备份'); });
    return;
  }
  if (el.id === 'free-ref') {
    var f = el.files && el.files[0];
    if (f && f.size > 20 * 1024 * 1024) { toast('参考图太大了，换一张 20MB 以内的'); el.value = ''; return; }
    freeRef = f || null; renderView(); return;
  }
  var cpath = el.getAttribute && el.getAttribute('data-check');
  if (cpath) { var p = cur(); setPath(p, cpath, el.checked); touch(p); render(); return; }
  var bpath = el.getAttribute && el.getAttribute('data-bind');
  if (bpath && (el.tagName === 'SELECT' || el.getAttribute('data-type') === 'num')) { renderSide(); if (el.getAttribute('data-type') === 'num') renderView(); }
});
document.addEventListener('submit', function (e) {
  var f = e.target.closest('[data-form]'); if (!f) return;
  e.preventDefault();
  var kind = f.getAttribute('data-form');
  if (kind === 'idea') {
    var raw = ideaText.trim();
    if (!raw) { toast('先写点什么'); return; }
    if (addIdea(raw, '手记', '')) { ideaText = ''; saveBrain(); renderView(); toast('已记下'); } else toast('灵感池里已经有这条了');
    return;
  }
  if (kind === 'lesson') {
    var lt = $('#lesson-text'), lg = $('#lesson-tag');
    if (!lt || !lt.value.trim()) { toast('先写一条经验'); return; }
    if (addLesson(lg ? lg.value : '文案', lt.value, '')) { saveBrain(); renderView(); toast('已添加'); } else toast('已经有这条经验了');
    return;
  }
  var t = $('#new-topic'); var topic = t ? t.value.trim() : '';
  createProject(topic);
});
window.addEventListener('hashchange', function () {
  var v = location.hash.slice(1); S.view = VIEWS.indexOf(v) >= 0 ? v : 'home'; S.confirmDel = false; render();
  if (HUB && (S.view === 'media' || S.view === 'paper')) {
    var t = hubTool(S.view);
    if (t && t.state !== 'ready' && t.state !== 'starting' && t.state !== 'stopped' && t.state !== 'error' && !HT.requested[t.id]) hubStart(t.id);
  }
});



/* ---------- boot ---------- */
(function boot() {
  var v = location.hash.slice(1); S.view = VIEWS.indexOf(v) >= 0 ? v : 'home';
  /* fonts are embedded at the top of the stylesheet; the page makes no outside requests except to the model addresses the user connects */
  render();
  initStorage();
  if (HUB) {
    hubRefresh().then(function () {
      var t = hubTool(S.view);
      if (t && S.view !== 'orders' && t.state !== 'ready' && t.state !== 'starting' && !HT.requested[t.id]) hubStart(t.id);
    });
    hubPolling();
    /* WebMCP: same two read/open-only tools as the original workbench; no files are submitted and no model is called */
    try {
      if (document.modelContext && document.modelContext.registerTool) {
        document.modelContext.registerTool({ name: 'get_workbench_tools', description: 'List this local workbench’s tools and readiness. No files are read and no model analysis is started.',
          inputSchema: { type: 'object', properties: {}, additionalProperties: false },
          execute: function () { return hubRefresh().then(function () { return HT.tools.map(function (t) { return { id: t.id, name: t.name, state: t.state }; }); }); } });
        document.modelContext.registerTool({ name: 'open_workbench_tool', description: 'Open an existing local tool in the workbench, starting its local service if necessary. Does not submit user files or invoke AI analysis.',
          inputSchema: { type: 'object', properties: { id: { type: 'string', enum: TOOL_VIEWS } }, required: ['id'], additionalProperties: false },
          execute: function (args) { var id = args && args.id; if (TOOL_VIEWS.indexOf(id) < 0) return { ok: false, code: 'unknown_tool' }; go(id); return { ok: true, id: id }; } });
      }
    } catch (e) {}
  }
})();
})();
</script>
